services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: lex-app
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html/app
      - ./writable:/var/www/html/writable
      - ./public:/var/www/html/public
      - ./000-default.conf:/etc/apache2/sites-available/000-default.conf
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      TZ: Asia/Manila

  db:
    image: mysql:8.0
    platform: linux/amd64
    container_name: lex-db
    command: --default-authentication-plugin=mysql_native_password --ssl=0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: docker_lex
      MYSQL_USER: docker-lex
      MYSQL_PASSWORD: docker-pass
    ports:
      - "3308:3308"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      timeout: 20s
      retries: 10
      interval: 10s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    container_name: lex-pma
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8082:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  mysql_data:
